name: CI

on:
  push:
  pull_request:

jobs:
  build-mpi-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libopenmpi-dev openmpi-bin

      - name: Configure
        run: cmake -S mpi -B build/mpi -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/mpi -j

      - name: Reject inapplicable two-process algorithms
        run: |
          bin=build/mpi/bin/benchmark_collectives_mpi
          for spec in all_gather:allgather:6 all_to_all:alltoall:5; do
            IFS=: read -r operation mca_operation algorithm <<<"$spec"
            env OMPI_MCA_coll_tuned_use_dynamic_rules=1 \
              "OMPI_MCA_coll_tuned_${mca_operation}_algorithm=$algorithm" \
              mpirun --oversubscribe -np 2 "$bin" \
                --operation="$operation" --algorithm="$algorithm" \
                --test_size=16 --iterations=1 --rpn=2
            if env OMPI_MCA_coll_tuned_use_dynamic_rules=1 \
              "OMPI_MCA_coll_tuned_${mca_operation}_algorithm=$algorithm" \
              mpirun --oversubscribe -np 4 "$bin" \
                --operation="$operation" --algorithm="$algorithm" \
                --test_size=16 --iterations=1 --rpn=4 \
                >"invalid_${operation}.log" 2>&1; then
              echo "$operation algorithm $algorithm unexpectedly accepted four ranks"
              exit 1
            fi
            grep -q "two_proc and requires exactly 2 ranks" \
              "invalid_${operation}.log"
          done

      - name: Smoke test (run each collective on 2 ranks)
        run: |
          bin=build/mpi/bin/benchmark_collectives_mpi
          for op in broadcast reduce scatter gather; do
            echo "::group::$op"
            mpirun --oversubscribe -np 2 "$bin" \
              --operation="$op" --test_size=16 --iterations=5 --rpn=2
            echo "::endgroup::"
          done

      - name: Check results were written
        run: |
          test -n "$(find result/mpi -name 'runtimes_broadcast_mpi.txt')"
          test -n "$(find result/mpi -name 'runtimes_reduce_mpi.txt')"
          test -n "$(find result/mpi -name 'runtimes_scatter_mpi.txt')"
          test -n "$(find result/mpi -name 'runtimes_gather_mpi.txt')"
          find result/mpi -name 'runtimes_*_mpi.txt' -exec cat {} \;
